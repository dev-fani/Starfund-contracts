name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
          components: rustfmt, clippy, llvm-tools-preview
          targets: wasm32v1-none

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -p starfund_escrow -- --check

      - name: Clippy
        run: cargo clippy -p starfund_escrow -- -D warnings

      - name: Build
        run: cargo build

      - name: Run tests
        run: cargo test

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Add WASM target
        run: rustup target add wasm32v1-none
      - name: Build WASM
        run: cargo build --target wasm32v1-none --release -p starfund_escrow

      - name: Workspace Clippy (all targets)
        run: cargo clippy -p starfund_escrow --all-targets -- -D warnings

      - name: Check coverage (report)
        run: |
          cargo llvm-cov \
            --features testutils \
            --summary-only \
            --fail-under-lines 90 \
            -p starfund_escrow

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit dependencies
        run: cargo audit --locked
